[package]
name = "postfix_ratelimit"
version = "0.1.0"
edition = "2024"

[dependencies]
signal-hook = "0.3"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
simple_logger = "5.1"
indymilter = "0.3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
tokio-rusqlite = "0.7"
regex = "1.12"
